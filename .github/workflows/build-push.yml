name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/market-data-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata — market-data-api
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/market-data-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push — market-data-api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/market-data-api
          file: ./apps/market-data-api/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=market-data-api
          cache-to: type=gha,mode=max,scope=market-data-api

      - name: Docker metadata — market-data-worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/market-data-worker
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push — market-data-worker
        uses: docker/build-push-action@v6
        with:
          context: ./apps/market-data-worker
          file: ./apps/market-data-worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=market-data-worker
          cache-to: type=gha,mode=max,scope=market-data-worker
