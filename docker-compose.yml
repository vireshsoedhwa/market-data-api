services:
  # ── Infrastructure ────────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: stock_dashboard
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_password
    ports:
      - "5432:5432"
    volumes:
      - stock_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Market Data Services ──────────────────────────────────────────
  market-data-api:
    build: ./apps/market-data-api
    ports:
      - "8010:8010"
    env_file:
      - .env.marketdata
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/market-data-api/app:/app/app
      - ./packages:/app/packages

  market-data-worker:
    build: ./apps/market-data-worker
    env_file:
      - .env.marketdata
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/market-data-worker/app:/app/app
      - ./packages:/app/packages

